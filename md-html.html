<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{title}</title>
<style>
  :root {
    --ivory: #FAF9F5;
    --paper: #FFFFFF;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    --oat: #E3DACC;
    --olive: #788C5D;
    --rust: #B04A3F;
    --g100: #F0EEE6;
    --g200: #E6E3DA;
    --g300: #D1CFC5;
    --g500: #87867F;
    --g700: #3D3D3A;
    --white: #FFFFFF;
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    --radius-panel: 12px;
    --radius-row: 8px;
    --border: 1.5px solid var(--g300);
    --fs: 17px; --lh: 1.7; --mw: 860px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    color: var(--slate); background: var(--ivory);
    padding: 56px 24px 120px; -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  .page, .c { max-width: var(--mw); margin: 0 auto; }
  .c { padding: 0; }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; color: var(--slate); line-height: 1.3; margin-top: 1.8em; margin-bottom: 0.5em; }
  h1 { font-size: 38px; margin-top: 0.2em; margin-bottom: 0.3em; }
  h1 + p { color: var(--g500); font-size: 14px; }
  h2 { font-size: 24px; margin-bottom: 6px; }
  h2 + hr, hr.rule { border: none; border-top: 1px solid var(--g300); margin: 0 0 22px; }
  hr { border: none; border-top: 1px solid var(--g300); margin: 2em 0; }
  h3 { font-size: 18px; } h4 { font-size: 16px; }
  p { margin-bottom: 1em; color: var(--slate); }
  a { color: var(--clay); text-decoration: none; border-bottom: 1px dotted transparent; }
  a:hover { color: var(--clay-d); border-bottom-color: var(--clay); text-decoration: none; }
  strong { color: var(--slate); font-weight: 600; }
  ul, ol { margin-bottom: 1em; padding-left: 1.5em; }
  li { margin-bottom: 0.4em; color: var(--g700); }
  li::marker { color: var(--g500); }
  blockquote {
    border-left: 4px solid var(--clay); background: var(--white);
    border-top: var(--border); border-right: var(--border); border-bottom: var(--border);
    padding: 0.9em 1.1em; margin: 1.2em 0; border-radius: 0 var(--radius-row) var(--radius-row) 0; color: var(--g700);
  }
  blockquote.tip { border-left-color: var(--olive); }
  blockquote.warning { border-left-color: var(--rust); }
  code { font-family: var(--mono); font-size: 0.88em; background: var(--g100); padding: 0.15em 0.4em; border-radius: 4px; }
  pre { font-family: var(--mono); font-size: 0.85em; background: var(--white); border: var(--border); padding: 1.1em 1.2em; border-radius: var(--radius-panel); overflow-x: auto; margin: 1.2em 0; line-height: 1.5; }
  pre code { background: none; padding: 0; border-radius: 0; border: none; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 1.2em 0; font-size: 14px; background: var(--white); border: var(--border); border-radius: var(--radius-panel); overflow: hidden; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--g500); background: var(--g100); padding: 12px 16px; border-bottom: 1px solid var(--g300); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--g100); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--ivory); }
  img { max-width: 100%; height: auto; border-radius: var(--radius-panel); margin: 1em 0; border: var(--border); }
  ::selection { background: var(--oat); }
  .back-top { display: block; text-align: right; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--g500); margin-top: -0.3em; margin-bottom: 1.2em; }
  .back-top:hover { color: var(--clay); }
  .footnotes { margin-top: 3em; padding-top: 1.2em; border-top: 1px solid var(--g300); font-size: 13px; color: var(--g500); }
  .footnotes ol { padding-left: 1.2em; }
  details { margin: 1.2em 0; background: var(--white); border: var(--border); border-radius: var(--radius-panel); padding: 0.6em 1.1em; }
  summary { cursor: pointer; font-weight: 600; color: var(--slate); font-family: var(--sans); }
  details[open] { padding-bottom: 1em; }
  /* html-effectiveness extras — optional, used when markdown opts in */
  .summary-band { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 1em 0 1.5em; }
  .stat-card { background: var(--white); border: var(--border); border-radius: var(--radius-panel); padding: 20px 22px 18px; }
  .stat-card.warn { border-left: 4px solid var(--clay); padding-left: 19px; }
  .stat-num { font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1; margin-bottom: 6px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--g500); }
  @media (max-width: 720px) { .summary-band { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { body { padding: 32px 16px 80px; } h1 { font-size: 28px; } h2 { font-size: 20px; } pre { font-size: 0.8em; } }
  @media print { body { background: white; color: black; padding: 0; } .page, .c { max-width: 100%; } }
  footer.gen { margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--g300); font-family: var(--mono); font-size: 11px; color: var(--g500); }
</style>
</head>
<body>
<div class="page c">{content}</div>
<footer class="gen" style="max-width:var(--mw);margin:64px auto 0;">Generated via /md-html — html-effectiveness palette (ivory/slate/clay/oat) · standalone, no build</footer>
</body>
</html>
