name: apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fsSL https://nsh.dev/install.sh | sh
        env:
          NSH_INSTALL_DIR: ${{ runner.temp }}/nsh
      - run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -q tools.zip && mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          nsh --version
          nsh package ./e1 --target android --abi arm64-v8a -o .nsh/out-arm64
          ls -lh .nsh/out-arm64/e1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: e1-android-arm64
          path: .nsh/out-arm64/e1.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: iwr https://nsh.dev/install.ps1 | iex
        shell: pwsh
      - run: nsh --version
        shell: pwsh
      - run: nsh package ./e1 --target windows -o .nsh/out-windows
        shell: pwsh
      - run: Get-ChildItem .nsh/out-windows -Recurse | Select-Object FullName, Length
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: e1-windows
          path: .nsh/out-windows/**
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e1-android-arm64
      - uses: actions/download-artifact@v4
        with:
          name: e1-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            e1.apk
            e1.zip
