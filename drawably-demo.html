<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Drawably — Web Delight Demo</title>
<link rel="stylesheet" href="https://unpkg.com/drawably@0.3.10/style.css"/>
<style>
  :root{--bg:#FAF9F5;--fg:#141413}
  @media(prefers-reduced-motion:reduce){.drawably-boil{animation:none !important}}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:860px;margin:56px auto;padding:0 24px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:24px 0}
  .card{padding:16px;border:1.5px solid #D1CFC5;border-radius:12px;background:#fff}
</style>
</head>
<body>
<h1>Drawably — hand-drawn delight</h1>
<p>Every stroke regenerates on mount. Hover to re-sketch. Zero deps, real inputs, boil in CSS.</p>
<div class="grid">
  <div class="card"><div id="btn1"></div></div>
  <div class="card"><div id="card1" style="padding:16px">Card Content</div></div>
  <div class="card"><label><input id="chk1" type="checkbox"/> Checkbox</label></div>
  <div class="card"><div id="input1"><input placeholder="Hand-drawn input"/></div></div>
</div>
<p><code>portless --name drawably pnpm dev</code> → <code>https://drawably.localhost</code></p>
<script type="module">
import { drawablyButton, drawablyCard, drawablyCheckbox, drawablyInput } from "https://unpkg.com/drawably@0.3.10/dist/drawably.js";
drawablyButton(document.getElementById('btn1'), { variant:'solid', state:'default', text:'Ship it', pen:'pen' });
drawablyCard(document.getElementById('card1'), { pen:'pencil' });
drawablyCheckbox(document.getElementById('chk1').parentElement, { pen:'marker' });
drawablyInput(document.getElementById('input1'), { pen:'pen' });
</script>
</body>
</html>
