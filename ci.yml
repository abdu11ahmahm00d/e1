name: ABSOLUTE Stack Enforcement

on: [push, pull_request]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check commit email
        run: |
          git log -1 --pretty=format:"%ae" | grep "319mahmood@gmail.com" || (echo "Commit email must be 319mahmood@gmail.com"; exit 1)
      - name: Check for secrets
        run: |
          if grep -rn "-----BEGIN" --include="*.{ts,js,rs,py,go}" . 2>/dev/null; then echo "Secrets found"; exit 1; fi
          if rg -rn "sk-[a-zA-Z0-9]{20,}" --include="*.{ts,js,rs,py,go}" . 2>/dev/null; then echo "API keys found"; exit 1; fi
      - name: Check grep usage (must use rg)
        run: |
          has_grep=$(rg -l "grep " --include="*.md" .opencode/agents/ .opencode/commands/ 2>/dev/null || true)
          if [ -n "$has_grep" ]; then echo "Use rg not grep in: $has_grep"; exit 1; fi
      - name: Check allowed languages
        run: |
          bad_ext=""
          for ext in "*.pyc" "*.exe" "*.dll" "*.obj" "*.o" "*.class" "*.jar"; do
            found=$(find . -name "$ext" 2>/dev/null | head -5)
            if [ -n "$found" ]; then bad_ext="$bad_ext $ext ($found)"; fi
          done
          if [ -n "$bad_ext" ]; then echo "Binary artifacts found: $bad_ext"; exit 1; fi
